name: AI & N8N Global Trend Monitor

on:
  schedule:
    # Run every 2 hours for tighter trend detection
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run AI Trend Monitor
      run: |
        python ai_trend_monitor.py

    - name: Copy Markdown to README
      run: |
        cp ai_trends.md README.md

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add ai_trends.json ai_trends.md README.md processed_hashes.txt
        git diff --cached --quiet || git commit -m "🤖 Update AI/N8N trend scan — $(date -u +'%Y-%m-%d %H:%M UTC')"
        git push https://${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }} HEAD:main
