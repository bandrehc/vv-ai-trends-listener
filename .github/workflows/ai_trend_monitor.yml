name: AI Daily Newsletter

on:
  schedule:
    - cron: "0 12 * * *"  # Daily at noon UTC (7am Lima)
  workflow_dispatch:

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - run: pip install requests feedparser deep-translator

    - run: python ai_trend_monitor.py

    - name: Commit
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add ai_trends.json ai_trends.md README.md processed_hashes.txt
        git diff --cached --quiet || git commit -m "📰 Daily AI Brief — $(date -u +'%B %d, %Y')"
        git push https://${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }} HEAD:main
